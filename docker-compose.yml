services:
  db:
    image: postgis/postgis:15-3.4
    container_name: garfo-db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garfo-app
    env_file:
      - .env
    ports:
      - '3000:3000'         # porta do express
      - '4983:4983'         # adiciona o Studio
    volumes:
      - .:/app              # código no host espelhado no container
      - /app/node_modules   # isola as deps
    depends_on:
      - db
    # REMOVA ou ajuste este comando: se no seu package.json só existe "start", 
    # use npm start; se tiver "dev", use npm run dev.
    command: ["npm", "start"]

volumes:
  db_data:
